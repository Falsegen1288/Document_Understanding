<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stage 2: Layout-Aware Semantic Chunking Annotation Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --border-color: #334155;
            --border-focus: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .file-controls {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-file {
            background-color: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-file:hover {
            border-color: var(--text-secondary);
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-name {
            font-size: 0.85rem;
            color: var(--accent-success);
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .left-pane {
            flex: 1;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: #0b0f19;
            position: relative;
            overflow: hidden;
        }

        .viewer-toolbar {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            background-color: var(--bg-surface);
            align-items: center;
            justify-content: flex-end;
            z-index: 10;
        }

        .btn-tool {
            background-color: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .btn-tool:hover {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .image-container {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        .right-pane {
            width: 480px;
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .tab-headers {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: #161e2e;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background-color: var(--bg-surface);
        }

        .tab-content-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tab-content.active {
            display: flex;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .candidate-card {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: border-color 0.2s ease;
        }

        .candidate-card:hover {
            border-color: var(--bg-surface-elevated);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .badge-title {
            background-color: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        .badge-semantic {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .badge-anchor {
            background-color: rgba(249, 115, 22, 0.15);
            color: #fdba74;
        }

        .elem-idx {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background-color: var(--bg-surface-elevated);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }

        .preview-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-primary);
            background-color: rgba(0, 0, 0, 0.2);
            padding: 0.5rem;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 120px;
            overflow-y: auto;
        }

        .decision-group {
            display: flex;
            gap: 1rem;
            margin-top: 0.25rem;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }

        .radio-label input[type="radio"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .neighbor-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            background-color: rgba(0, 0, 0, 0.1);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .neighbor-row input[type="checkbox"] {
            margin-top: 0.2rem;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .neighbor-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .neighbor-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .input-text-custom {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .input-text-custom:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background-color: var(--bg-base);
            padding: 1rem;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }

        .field-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .right-pane-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background-color: #161e2e;
            flex-shrink: 0;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem;
            gap: 1rem;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-secondary);
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-surface-elevated);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header>
        <h1>Stage 2: Chunking Ground Truth Annotator</h1>
        <div class="file-controls">
            <div class="control-group">
                <label>1. Candidates JSON:</label>
                <div class="file-input-wrapper">
                    <button class="btn-file">Choose JSON</button>
                    <input type="file" id="json-loader" accept=".json">
                </div>
                <span id="json-file-name" class="file-name"></span>
            </div>
            <div class="control-group">
                <label>2. Page Overlay PNG:</label>
                <div class="file-input-wrapper">
                    <button class="btn-file">Choose PNG</button>
                    <input type="file" id="png-loader" accept=".png">
                </div>
                <span id="png-file-name" class="file-name"></span>
            </div>
        </div>
    </header>

    <main>
        <div class="left-pane">
            <div class="viewer-toolbar">
                <button class="btn-tool" onclick="adjustZoom(0.1)" title="Zoom In">+</button>
                <button class="btn-tool" onclick="adjustZoom(-0.1)" title="Zoom Out">-</button>
                <button class="btn-tool" onclick="resetZoom()" title="Reset Zoom">⟳</button>
            </div>
            <div class="image-container" id="image-container">
                <div id="no-img-text" class="empty-state">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375 0 11-.75 0 .375 0 017.5 0z" />
                    </svg>
                    <p>Load the page overlay PNG file to display it here</p>
                </div>
                <img id="page-image" style="display:none;" alt="Rendered PDF Page">
            </div>
        </div>

        <div class="right-pane">
            <div class="tab-headers">
                <button class="tab-btn active" onclick="switchTab('boundaries')">Boundaries</button>
                <button class="tab-btn" onclick="switchTab('groundings')">Groundings</button>
            </div>

            <div class="tab-content-container" id="annotation-panel-body">
                <div id="no-data-text" class="empty-state">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                    </svg>
                    <p>Load the candidates JSON file to display lists here</p>
                </div>

                <!-- Boundaries Tab Content -->
                <div class="tab-content active" id="tab-boundaries" style="display:none;">
                    <div class="panel-title">Verify Chunk Boundaries</div>
                    <div id="boundaries-list" style="display:flex; flex-direction:column; gap:1rem;">
                        <!-- Candidate items populated dynamically -->
                    </div>
                    <div class="field-group">
                        <label for="custom-boundaries">Add Missed Boundaries (element indices, comma separated):</label>
                        <input type="text" id="custom-boundaries" class="input-text-custom" placeholder="e.g. 12, 45, 78">
                    </div>
                </div>

                <!-- Groundings Tab Content -->
                <div class="tab-content" id="tab-groundings" style="display:none;">
                    <div class="panel-title">Verify Table/Figure Groundings</div>
                    <div id="groundings-list" style="display:flex; flex-direction:column; gap:1.25rem;">
                        <!-- Grounding candidate items populated dynamically -->
                    </div>
                </div>
            </div>

            <div class="right-pane-footer" id="panel-footer" style="display:none;">
                <button class="btn-primary" onclick="saveAnnotations()">Save & Download Annotations</button>
            </div>
        </div>
    </main>

    <script>
        let candidateData = null;
        let zoomLevel = 1.0;

        // File loading handlers
        document.getElementById('json-loader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('json-file-name').innerText = file.name;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    candidateData = JSON.parse(evt.target.result);
                    initAnnotations();
                } catch(err) {
                    alert("Error parsing JSON: " + err.message);
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('png-loader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('png-file-name').innerText = file.name;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = document.getElementById('page-image');
                img.src = evt.target.result;
                img.style.display = 'block';
                document.getElementById('no-img-text').style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

        // Tab switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.innerText.toLowerCase() === tabId);
            if (activeBtn) activeBtn.classList.add('active');

            const activeContent = document.getElementById('tab-' + tabId);
            if (activeContent) activeContent.classList.add('active');
        }

        // Zoom operations
        function adjustZoom(amount) {
            const img = document.getElementById('page-image');
            if (img.style.display === 'none') return;
            zoomLevel = Math.max(0.5, Math.min(3.0, zoomLevel + amount));
            img.style.transform = `scale(${zoomLevel})`;
        }

        function resetZoom() {
            zoomLevel = 1.0;
            const img = document.getElementById('page-image');
            if (img) img.style.transform = `scale(${zoomLevel})`;
        }

        // Initialize lists from candidate JSON
        function initAnnotations() {
            document.getElementById('no-data-text').style.display = 'none';
            document.getElementById('tab-boundaries').style.display = 'flex';
            document.getElementById('tab-groundings').style.display = 'flex';
            document.getElementById('panel-footer').style.display = 'block';

            // Populate Boundaries List
            const bList = document.getElementById('boundaries-list');
            bList.innerHTML = '';
            if (candidateData.boundary_candidates && candidateData.boundary_candidates.length > 0) {
                candidateData.boundary_candidates.forEach((cand, idx) => {
                    const card = document.createElement('div');
                    card.className = 'candidate-card';
                    
                    const badgeClass = cand.source === 'title' ? 'badge-title' : 'badge-semantic';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="elem-idx">Element [${cand.element_idx}]</span>
                            <span class="badge ${badgeClass}">${cand.source}</span>
                        </div>
                        <div class="preview-text">${escapeHtml(cand.content_preview)}</div>
                        <div class="decision-group">
                            <label class="radio-label">
                                <input type="radio" name="boundary_${cand.element_idx}" value="accept" checked>
                                Accept Boundary
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="boundary_${cand.element_idx}" value="reject">
                                Reject (Merge)
                            </label>
                        </div>
                    `;
                    bList.appendChild(card);
                });
            } else {
                bList.innerHTML = '<p style="font-size:0.85rem; color:var(--text-secondary)">No candidate boundaries found on this page.</p>';
            }

            // Populate Groundings List
            const gList = document.getElementById('groundings-list');
            gList.innerHTML = '';
            if (candidateData.grounding_candidates && candidateData.grounding_candidates.length > 0) {
                candidateData.grounding_candidates.forEach((anchor, idx) => {
                    const card = document.createElement('div');
                    card.className = 'candidate-card';

                    let neighborsHtml = '';
                    anchor.nearest_text.forEach(neighbor => {
                        neighborsHtml += `
                            <div class="neighbor-row">
                                <input type="checkbox" id="grounding_${anchor.anchor_idx}_${neighbor.element_idx}" value="${neighbor.element_idx}">
                                <div class="neighbor-details">
                                    <div class="neighbor-meta">Element [${neighbor.element_idx}] — Gap: ${neighbor.gap}px</div>
                                    <div class="preview-text" style="background-color:transparent; padding:0; font-size:0.8rem; overflow-y:visible; max-height:none;">${escapeHtml(neighbor.content_preview)}</div>
                                </div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="elem-idx">Anchor [${anchor.anchor_idx}] (${anchor.anchor_type})</span>
                            <span class="badge badge-anchor">anchor</span>
                        </div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.25rem;">Select True Grounded Text Neighbors:</div>
                        <div style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.75rem;">
                            ${neighborsHtml || '<p style="font-size:0.85rem; color:var(--text-secondary)">No text elements found on page.</p>'}
                        </div>
                        <div class="field-group" style="padding:0.5rem; border-style:solid; border-radius:4px; gap:0.25rem;">
                            <label style="font-size:0.75rem;">Add Other Grounded Indices (comma separated):</label>
                            <input type="text" id="custom_grounding_${anchor.anchor_idx}" class="input-text-custom" style="padding:0.4rem;" placeholder="e.g. 15, 23">
                        </div>
                    `;
                    gList.appendChild(card);
                });
            } else {
                gList.innerHTML = '<p style="font-size:0.85rem; color:var(--text-secondary)">No tables or figures found on this page.</p>';
            }

            // Always switch to boundary tab first
            switchTab('boundaries');
        }

        // Serialize and download results
        function saveAnnotations() {
            if (!candidateData) return;

            const finalBoundaries = [];
            const finalGroundings = {};

            // Collect accepted boundaries
            if (candidateData.boundary_candidates) {
                candidateData.boundary_candidates.forEach(cand => {
                    const selector = `input[name="boundary_${cand.element_idx}"]:checked`;
                    const selectedVal = document.querySelector(selector).value;
                    if (selectedVal === 'accept') {
                        finalBoundaries.push(cand.element_idx);
                    }
                });
            }

            // Append custom user boundaries
            const customBoundInput = document.getElementById('custom-boundaries').value.trim();
            if (customBoundInput) {
                customBoundInput.split(',').forEach(part => {
                    const idx = parseInt(part.trim(), 10);
                    if (!isNaN(idx) && !finalBoundaries.includes(idx)) {
                        finalBoundaries.push(idx);
                    }
                });
            }

            // Collect groundings
            if (candidateData.grounding_candidates) {
                candidateData.grounding_candidates.forEach(anchor => {
                    const groundedList = [];
                    // Checkboxes
                    anchor.nearest_text.forEach(neighbor => {
                        const cb = document.getElementById(`grounding_${anchor.anchor_idx}_${neighbor.element_idx}`);
                        if (cb && cb.checked) {
                            groundedList.push(neighbor.element_idx);
                        }
                    });
                    
                    // Custom grounding text input
                    const customGroundInput = document.getElementById(`custom_grounding_${anchor.anchor_idx}`).value.trim();
                    if (customGroundInput) {
                        customGroundInput.split(',').forEach(part => {
                            const idx = parseInt(part.trim(), 10);
                            if (!isNaN(idx) && !groundedList.includes(idx)) {
                                groundedList.push(idx);
                            }
                        });
                    }

                    finalGroundings[anchor.anchor_idx.toString()] = groundedList.sort((a,b) => a-b);
                });
            }

            const output = {
                doc_stem: candidateData.doc_stem,
                page: candidateData.page,
                boundaries: finalBoundaries.sort((a,b) => a-b),
                groundings: finalGroundings
            };

            // Trigger download
            const jsonString = JSON.stringify(output, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.download = `${candidateData.doc_stem}_p${candidateData.page}_annotated.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Helper to prevent HTML injection in previews
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
