version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: du_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: .
    container_name: du_backend
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  worker:
    build: .
    container_name: du_worker
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./storage:/app/storage
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always
